[project]
name = "natural-agi-common"
version = "0.1.51"
description = "Components of reduction neural networks concept"
authors = [
    {name = "koboh", email = "konstboh@gmail.com"},
    {name = "nlapin", email = "nlapin.java@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.0.0",
    "opencv-python>=4.10.0",
    "pillow>=11.0.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "networkx>=3.4",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "kafka-python>=2.3.0",
    "nuclio-sdk>=0.5.6",
    "msgpack>=1.0.0",
    "rdp>=0.8",
    "skan>=0.12.0",
    "ypstruct>=0.0.2",
    "tqdm>=4.66.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
