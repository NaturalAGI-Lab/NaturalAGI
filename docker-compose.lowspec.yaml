# Override for 8 GB RAM machines (see docs/WINDOWS_LOWSPEC.md). Used by `make PROFILE=lowspec`:
#   docker compose -f docker-compose.yaml -f docker-compose.lowspec.yaml up -d
# Budget inside the WSL2 VM (6 GB): Neo4j ~1.1 GB + Kafka ~0.6 GB + 5 functions ~2 GB + OS.

services:
  neo4j:
    environment:
      # APOC / GDS are not used by the code; skipping them saves a download and RAM.
      - NEO4J_PLUGINS=[]
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
      - NEO4J_dbms_memory_transaction_total_max=256M
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1200M

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_NUM_PARTITIONS: 1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

  # Not needed to run the pipeline. Start them explicitly with `--profile full` if you must.
  nuclio-dashboard:
    image: ${NUCLIO_DASHBOARD_IMAGE:-quay.io/nuclio/dashboard:1.15.20-amd64}
    profiles: ["full"]

  postgres:
    profiles: ["full"]

  mlflow:
    profiles: ["full"]
