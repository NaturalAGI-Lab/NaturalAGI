x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

networks:
  neo4j-internal:
    driver: bridge

volumes:
  pgdata:

services:

  server1:
    # Docker image to be used
    image: ${NEO4J_DOCKER_IMAGE}

    # Hostname
    hostname: server1

    # Service-level network, which specifies the networks, from the list of the top-level networks (in this case only neo4j-internal), that the server will connect to.
    # Adds a network alias (used in neo4j.conf when configuring the discovery members)
    networks:
      neo4j-internal:
        aliases:
          - neo4j-network

    # The ports that will be accessible from outside the container - HTTP (7474) and Bolt (7687).
    ports:
      - "7474:7474"
      - "7687:7687"

    # Passes the following environment variables to the container
    environment:
      - NEO4J_AUTH
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_server_memory_heap_initial__size=1500m
      - NEO4J_server_memory_heap_max__size=1500m
      - NEO4J_server_memory_pagecache_size=1500m
      - NEO4J_dbms_memory_transaction_total_max=512M
      - NEO4J_dbms.security.procedures.unrestricted=apoc.*
      - NEO4J_db_tx__log_rotation_retention__policy=100M size

    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
      - ./neo4j-dumps:/dumps

    # Simple check testing whether the port 7474 is opened.
    # If so, the instance running inside the container is considered as "healthy".
    # This status can be checked using the "docker ps" command.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
    <<: *default-logging

  nuclio-dashboard:

    image: quay.io/nuclio/dashboard:1.15.20-arm64

    hostname: nuclio-dashboard
    container_name: nuclio-dashboard

    networks:
      neo4j-internal:
        aliases:
          - neo4j-network
    
    deploy:
      mode: replicated
      replicas: 1

    ports:
      - "8070:8070"
    
    expose:
      - '8070'
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    <<: *default-logging

  kafka:
    image: confluentinc/cp-kafka:8.2.0
    hostname: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # Listeners
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP}:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Topic defaults
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      # Log retention
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 104857600
      KAFKA_LOG_SEGMENT_BYTES: 16777216
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000
    networks:
      - neo4j-internal
    <<: *default-logging

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    networks:
      - neo4j-internal
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${HOST_IP}:29092
    <<: *default-logging

  postgres:
    image: postgres:16-alpine
    networks:
      - neo4j-internal
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MLFLOW_DB_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    <<: *default-logging

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    networks:
      - neo4j-internal
    ports:
      - "5050:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${MLFLOW_DB_USER}:${MLFLOW_DB_PASSWORD}@postgres:5432/${MLFLOW_DB_NAME}
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    <<: *default-logging