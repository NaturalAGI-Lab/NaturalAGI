x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"

networks:
  neo4j-internal:
    driver: bridge

services:

  server1:
    # Docker image to be used
    image: ${NEO4J_DOCKER_IMAGE}

    # Hostname
    hostname: server1

    # Service-level network, which specifies the networks, from the list of the top-level networks (in this case only neo4j-internal), that the server will connect to.
    # Adds a network alias (used in neo4j.conf when configuring the discovery members)
    networks:
      neo4j-internal:
        aliases:
          - neo4j-network

    # The ports that will be accessible from outside the container - HTTP (7474) and Bolt (7687).
    ports:
      - "7474:7474"
      - "7687:7687"

    # Passes the following environment variables to the container
    environment:
      - NEO4J_AUTH
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_server_memory_heap_initial__size=1500m
      - NEO4J_server_memory_heap_max__size=1500m
      - NEO4J_server_memory_pagecache_size=1500m
      - NEO4J_dbms_memory_transaction_total_max=512M
      - NEO4J_dbms.security.procedures.unrestricted=apoc.*
      - NEO4J_db_tx__log_rotation_retention__policy=1 days

    volumes:
      - ./neo4j-data:/data
      - ./neo4j-logs:/logs
      - ./neo4j-dumps:/dumps

    # Simple check testing whether the port 7474 is opened.
    # If so, the instance running inside the container is considered as "healthy".
    # This status can be checked using the "docker ps" command.
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
    <<: *default-logging

  nuclio-dashboard:

    image: quay.io/nuclio/dashboard:1.15.14-arm64

    hostname: nuclio-dashboard
    container_name: nuclio-dashboard

    networks:
      neo4j-internal:
        aliases:
          - neo4j-network
    
    deploy:
      mode: replicated
      replicas: 1

    ports:
      - "8070:8070"
    
    expose:
      - '8070'
    
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    <<: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    networks:
      - neo4j-internal
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    <<: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${HOST_IP}:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_RETENTION_BYTES: 104857600          # 100 MB per partition (was 512 MB)
      KAFKA_LOG_SEGMENT_BYTES: 16777216             # 16 MB segments (was 64 MB — faster rollover → faster cleanup)
      KAFKA_LOG_INDEX_SIZE_MAX_BYTES: 1048576       # 1 MB index pre-alloc (was 10 MB default — 80 partitions × 20 MB = 1.6 GB saved)
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 30000  # check every 30s (was 60s)
    networks:
      - neo4j-internal
    depends_on:
      - zookeeper
    <<: *default-logging

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    networks:
      - neo4j-internal
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${HOST_IP}:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    <<: *default-logging

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.21.3
    networks:
      - neo4j-internal
    ports:
      - "5050:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
    <<: *default-logging

  jaeger:
    image: jaegertracing/jaeger:latest
    networks:
      - neo4j-internal
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./jaeger-data:/badger
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml
      - ./jaeger-ui-config.json:/etc/jaeger/jaeger-ui-config.json
      - ./jaeger-ui-patched:/etc/jaeger/ui
    command: ["--config", "/etc/jaeger/config.yaml"]
    depends_on:
      - prometheus
    <<: *default-logging

  prometheus:
    image: prom/prometheus:latest
    networks:
      - neo4j-internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-recording-rules.yml:/etc/prometheus/recording_rules.yml
      - ./prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
      - '--storage.tsdb.retention.size=200MB'
    <<: *default-logging