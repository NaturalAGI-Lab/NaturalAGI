service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  jaeger_query:
    storage:
      traces: badger_store
      metrics: prometheus_store
    ui:
      config_file: /etc/jaeger/jaeger-ui-config.json
      assets_path: /etc/jaeger/ui
  jaeger_storage:
    backends:
      badger_store:
        badger:
          directories:
            keys: /badger/key
            values: /badger/data
          ephemeral: false
          maintenance_interval: 5m
          ttl:
            spans: 1h
    metric_backends:
      prometheus_store:
        prometheus:
          endpoint: http://prometheus:9090
          metric_namespace: ""
          normalize_calls: true
          normalize_duration: true

connectors:
  spanmetrics:
    namespace: ""
    metrics_flush_interval: 15s

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: badger_store
  prometheus:
    endpoint: "0.0.0.0:8889"
