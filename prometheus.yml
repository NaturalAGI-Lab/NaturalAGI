global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording_rules.yml

scrape_configs:
  - job_name: span-metrics
    honor_labels: true
    static_configs:
      - targets: ['jaeger:8889']

  - job_name: jaeger-internal
    static_configs:
      - targets: ['jaeger:8888']
