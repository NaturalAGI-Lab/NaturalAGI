[project]
name = "natural-agi"
version = "0.1.0"
description = "Non-backpropagation approach to pattern recognition and classification"
authors = [
    {name = "koboh", email = "konstboh@gmail.com"},
    {name = "nlapin", email = "nlapin.java@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "natural-agi-common>=0.1.49",
]

[project.optional-dependencies]
dev = [
    "notebook>=7.0.4",
    "ipywidgets>=8.0.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "bibtexparser>=1.4.0",
    "pyvis>=0.3.0",
    "duckdb>=1.0.0",
    "mlflow>=3.0.0",
    "psutil>=5.9.0",
    "streamlit>=1.40.0",
    "optuna>=4.0.0",
]
ml = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "torch-geometric>=2.4.0",
    "grakel>=0.1.10",
    "gspan-mining>=0.2.0",
    "pandas>=2.0.0",
]

[dependency-groups]
dev = [
    "notebook>=7.0.4",
    "ipywidgets>=8.0.0",
    "seaborn>=0.13.0",
    "python-dotenv>=1.0.0",
    "bibtexparser>=1.4.0",
    "pyvis>=0.3.0",
    "duckdb>=1.0.0",
    "mlflow>=3.0.0",
    "psutil>=5.9.0",
    "streamlit>=1.40.0",
    "optuna>=4.0.0",
]
