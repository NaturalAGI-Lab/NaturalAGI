apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: classification
  labels:
    nuclio.io/project-name: "default"
spec:
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.12"
  resources:
    limits:
      cpu: "2"
      memory: "4Gi"
    requests:
      cpu: "1"
      memory: "2Gi"
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://mlflow:5000"
    # Feature list override (JSON array). Uncomment to activate:
    # - name: CLASSIFICATION_FEATURES
    #   value: '["normalized_x","normalized_y","horizontal_direction","vertical_direction","cycle_count"]'
    # Node cost values override (JSON object). Uncomment to activate:
    # - name: CLASSIFICATION_NODE_COSTS
    #   value: '{"NO_COST":0.0,"MINOR":0.25,"GENERAL":0.4,"SEVERE":0.65,"NO_MATCH":1.0,"IMPOSSIBLE":100.0}'
    - name: OMP_NUM_THREADS
      value: "1"
    - name: OPENBLAS_NUM_THREADS
      value: "1"
    - name: MKL_NUM_THREADS
      value: "1"
    - name: VECLIB_MAXIMUM_THREADS
      value: "1"
    - name: NUMEXPR_NUM_THREADS
      value: "1"
  build:
    baseImage: "naturalagi-base:latest"
    commands:
      # Shared deps (numpy/neo4j/networkx/scipy/kafka/OTEL/...) live in naturalagi-base.
      - "pip install --no-cache-dir pot==0.9.6"
      - "pip install --upgrade natural-agi-common==0.1.55"
  triggers:
    default-http:
      kind: "http"
      attributes:
        port: 5001
