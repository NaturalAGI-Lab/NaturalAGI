apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: concept_creator
  labels:
    nuclio.io/project-name: "default"
spec:
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.12"
  env:
    - name: NEO4J_DSN
      value: "bolt://neo4j:7687"
    - name: NEO4J_USER
      value: "neo4j"
    - name: NEO4J_PASS
      value: "111122223333"
    - name: USE_ENERGY_MINIMIZATION
      value: "false"
  build:
    baseImage: "naturalagi-base:latest"
    commands:
      # All deps (numpy/neo4j/networkx/scikit-learn/msgpack/...) live in naturalagi-base.
      - "pip install --upgrade natural-agi-common==0.1.55"
  triggers:
    default-http:
      kind: "http"
      attributes:
        port: 5056
