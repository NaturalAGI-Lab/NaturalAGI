apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: connector
  labels:
    nuclio.io/project-name: "default"
spec:
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.9"
  build:
    baseImage: "python:3.9"
    commands:
      - "apt-get update -y --fix-missing"
      - "apt-get install -y libgl1-mesa-dev libglib2.0-0"
      - "pip install requests pydantic-settings kafka-python msgpack"
  triggers:
    default-http:
      kind: "http"
      attributes:
        port: 5002
