apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: connector
  labels:
    nuclio.io/project-name: "default"
spec:
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.12"
  build:
    baseImage: "naturalagi-base:latest"
    commands:
      # All deps (requests/kafka/msgpack/OTEL/...) live in naturalagi-base; only the lib changes.
      - "pip install --upgrade natural-agi-common==0.1.55"
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://mlflow:5000"
  triggers:
    default-http:
      kind: "http"
      attributes:
        port: 5002
