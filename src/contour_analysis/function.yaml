metadata:
  name: contour_analysis
  namespace: natural-agi
  labels:
    nuclio.io/project-name: natural-agi
spec:
  handler: "nuclio_handler:handler"
  runtime: "python:3.9"
  resources: {}
  minReplicas: 1
  maxReplicas: 1
  env:
    - name: MERGE_THRESHOLD
      value: "10.0"
  triggers:
    kafka-trigger:
      kind: kafka-cluster
      attributes:
        initialOffset: earliest
        topics:
          - angle-point-detector-output
        brokers:
          - ${KAFKA_BOOTSTRAP_SERVERS}
        consumerGroup: contour-analysis-group
  version: -1
  build:
    baseImage: "python:3.9"
    commands:
      - "apt-get update -y --fix-missing"
      - "apt-get install -y libgl1-mesa-glx"
      - "pip install --upgrade pip"
      - "pip install numpy opencv-python pydantic-settings neo4j scikit-learn kafka-python networkx scipy"
      - "pip install --upgrade natural-agi-common==0.1.25"
  loggerSinks:
    - level: debug
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
      # network: infrastructure_neo4j-internal
  securityContext: {}
  eventTimeout: ""
  httpTimeout: 1000
