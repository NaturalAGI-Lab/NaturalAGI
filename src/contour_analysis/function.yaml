metadata:
  name: contour_analysis
  labels:
    nuclio.io/project-name: "default"
spec:
  handler: "nuclio_handler:handler"
  runtime: "python:3.12"
  resources: {}
  env:
    - name: MERGE_THRESHOLD
      value: "10.0"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://mlflow:5000"
  triggers:
    kafka-trigger:
      kind: kafka-cluster
      attributes:
        initialOffset: earliest
        topics:
          - skeletonization-output-topic
        brokers:
          - ${KAFKA_BOOTSTRAP_SERVERS}
        consumerGroup: contour-analysis-group
  version: -1
  build:
    baseImage: "naturalagi-base:latest"
    commands:
      # Shared deps (numpy/neo4j/scikit-learn/networkx/scipy/kafka/OTEL/...) live in naturalagi-base.
      - "pip install --no-cache-dir opencv-python==4.13.0.92"
      - "pip install --upgrade natural-agi-common==0.1.55"
  loggerSinks:
    - level: debug
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
  securityContext: {}
  eventTimeout: ""
  httpTimeout: 1000
