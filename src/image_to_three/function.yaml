metadata:
  name: image-exporter
  labels:
    nuclio.io/project-name: natural-agi
spec:
  handler: "nuclio_handler:handler"
  runtime: "python:3.9"
  resources: {}
  minReplicas: 1
  maxReplicas: 1
  triggers:
    default-http:
      class: ""
      kind: http
      name: default-http
      maxWorkers: 1
      attributes:
        serviceType: ClusterIP
  version: 0.1.0
  build:
    baseImage: "python:3.9"
    commands:
      - 'apt-get update -y --fix-missing'
      - 'apt-get install -y libgl1-mesa-glx'
      - 'pip install numpy requests opencv-python pydantic neo4j'
  loggerSinks:
    - level: debug
  platform: {}
  securityContext: {}
  eventTimeout: ""