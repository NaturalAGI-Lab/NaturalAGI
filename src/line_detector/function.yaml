metadata:
  name: line_detector
  namespace: natural-agi
  labels:
    nuclio.io/project-name: natural-agi
spec:
  handler: "nuclio_handler:handler"
  runtime: "python:3.9"
  resources: {}
  minReplicas: 1
  maxReplicas: 1
  version: -1
  build:
    baseImage: "python:3.9"
    commands:
      - 'apt-get update -y --fix-missing'
      - 'apt-get install -y libgl1-mesa-glx'
      - 'pip install numpy requests opencv-python pydantic-settings kafka-python'
  loggerSinks:
    - level: debug
  platform: 
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
  securityContext: {}
  eventTimeout: ""
  httpTimeout: 1000