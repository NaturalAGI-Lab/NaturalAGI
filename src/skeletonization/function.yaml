apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: skeletonization
  labels:
    nuclio.io/project-name: "default"
spec:
  platform:
    dockerConfig:
      loggingOpts:
        maxSize: 10m
        max-file: "3"
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.9"
  build:
    baseImage: "python:3.9"
    commands:
      - "apt-get update -y --fix-missing"
      - "apt-get install -y libgl1-mesa-dev libglib2.0-0"
      - "pip install numpy pydantic-settings kafka-python rdp scikit-image networkx ypstruct opencv-python skan msgpack opentelemetry-api opentelemetry-sdk opentelemetry-exporter-otlp-proto-grpc"
      - "pip install --upgrade natural-agi-common==0.1.46"
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://jaeger:4317"
  triggers:
    kafka-trigger:
      kind: kafka-cluster
      attributes:
        initialOffset: earliest
        topics:
          - connector-output-topic
        brokers:
          - ${KAFKA_BOOTSTRAP_SERVERS}
        consumerGroup: skeletonization-group
