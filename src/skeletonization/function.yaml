apiVersion: "nuclio.io/v1"
kind: "Function"
metadata:
  name: skeletonization
  labels:
    nuclio.io/project-name: "default"
spec:
  platform:
    dockerConfig:
      loggingOpts:
        maxSize: 10m
        max-file: "3"
  httpTimeout: 1000
  handler: "nuclio_handler:handler"
  runtime: "python:3.12"
  build:
    baseImage: "naturalagi-base:latest"
    commands:
      # Shared deps (numpy/networkx/kafka/msgpack/OTEL/...) live in naturalagi-base.
      - "pip install --no-cache-dir rdp==0.8 scikit-image==0.26.0 ypstruct==0.0.2 opencv-python==4.13.0.92 skan==0.13.0 numba==0.64.0"
      - "pip install --upgrade natural-agi-common==0.1.55"
  env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: "http://mlflow:5000"
  triggers:
    kafka-trigger:
      kind: kafka-cluster
      attributes:
        initialOffset: earliest
        topics:
          - connector-output-topic
        brokers:
          - ${KAFKA_BOOTSTRAP_SERVERS}
        consumerGroup: skeletonization-group
